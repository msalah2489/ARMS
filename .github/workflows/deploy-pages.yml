name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Supabase build env
        id: supabase_env
        env:
          URL_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          URL_VAR: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          KEY_VAR: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          USE_DEMO_VAR: ${{ vars.NEXT_PUBLIC_USE_DEMO }}
        run: |
          URL="${URL_SECRET:-$URL_VAR}"
          KEY="${KEY_SECRET:-$KEY_VAR}"
          USE_DEMO="${USE_DEMO_VAR:-false}"
          if [ -z "$URL" ]; then
            URL="https://khjjfqqaeaeynnaizycq.supabase.co"
          fi

          # Require classic anon JWT only. Short sb_publishable_* keys return 401.
          is_valid_anon_jwt() {
            local k="$1"
            [ "${#k}" -ge 100 ] || return 1
            case "$k" in
              *your-anon*|*your-publishable*) return 1 ;;
              eyJ*.*.*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "$USE_DEMO" != "true" ]; then
            if [ -z "$KEY" ]; then
              echo "::error::Missing NEXT_PUBLIC_SUPABASE_ANON_KEY. In Supabase → Project Settings → API, copy the long JWT «anon public» key (starts with eyJ), then set Actions secret/variable NEXT_PUBLIC_SUPABASE_ANON_KEY and re-run this workflow."
              exit 1
            fi
            if ! is_valid_anon_jwt "$KEY"; then
              echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY must be a classic anon JWT (eyJ…, three segments, length >= 100). Short sb_publishable_ keys are rejected because they return 401 Invalid API key."
              exit 1
            fi
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "use_demo=$USE_DEMO" >> "$GITHUB_OUTPUT"
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_USE_DEMO: ${{ steps.supabase_env.outputs.use_demo }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase_env.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase_env.outputs.key }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
